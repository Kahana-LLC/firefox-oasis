<hbox flex="1" id="browser">
  <box context="sidebar-context-menu" id="sidebar-main" hidden="true">
    <html:sidebar-main flex="1">
      <box id="vertical-tabs" slot="tabstrip" customizable="true" contextmenu="toolbar-context-menu"></box>
    </html:sidebar-main>
  </box>
  <splitter id="sidebar-launcher-splitter" class="chromeclass-extrachrome sidebar-splitter" resizebefore="sibling" resizeafter="none" hidden="true"/>
  <vbox id="sidebar-box" hidden="true" class="chromeclass-extrachrome">
    <box id="sidebar-header" align="center">
      <toolbarbutton id="sidebar-switcher-target" class="tabbable" aria-expanded="false">
        <image id="sidebar-icon" consumeanchor="sidebar-switcher-target"/>
        <label id="sidebar-title" crop="end" control="sidebar"/>
        <image id="sidebar-switcher-arrow"/>
      </toolbarbutton>
      <image id="sidebar-throbber"/>
      <spacer id="sidebar-spacer"/>
      <toolbarbutton id="sidebar-close" class="close-icon tabbable" data-l10n-id="sidebar-close-button"/>
    </box>
    <stack class="sidebar-browser-stack">
      <browser id="sidebar" autoscroll="false" disablehistory="true" disablefullscreen="true" tooltip="aHTMLTooltip"/>
    </stack>
  </vbox>
  <splitter id="sidebar-splitter" class="chromeclass-extrachrome sidebar-splitter" resizebefore="sibling" resizeafter="none" hidden="true"/>
  <tabbox id="tabbrowser-tabbox" flex="1" tabcontainer="tabbrowser-tabs">
    <tabpanels id="tabbrowser-tabpanels" flex="1" selectedIndex="0"/>
  </tabbox>
  <splitter id="ai-window-splitter" class="chromeclass-extrachrome sidebar-splitter" resizebefore="none" resizeafter="sibling" hidden="true"/>
  <vbox id="ai-window-box" hidden="true" class="chromeclass-extrachrome ai-window-right-sidebar">
    <stack class="ai-window-browser-stack" flex="1">
    </stack>
  </vbox>
  <!-- Oasis Assistant overlay container: covers entire browser window when active -->
  <!-- Chrome header and resizer are now created dynamically in browser-sidebar.js -->
  <html:div id="oasis-assistant-overlay" hidden="true">
    <html:div id="oasis-assistant-shell" style="position:fixed; left:24px; top:96px; width:min(95vw, 900px); height:min(85vh, 680px); z-index:2147483646; pointer-events:auto; box-shadow:0 20px 40px rgba(0,0,0,0.25); border-radius:14px; background:white;">
      <!-- Chrome header is now dynamically created in browser-sidebar.js
      <html:div id="oasis-assistant-chrome-header" style="position:absolute; left:8px; top:8px; height:32px; display:flex; align-items:center; gap:8px; padding:4px 8px; background:#F0F6F1; border:1px solid #E5E7EB; border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.20); cursor:grab; z-index:2147483647; pointer-events:auto;">
        <html:span style="font-weight:600; color:#111827;">Oasis Assistant</html:span>
        <html:button id="oasis-assistant-expand" style="border:0; background:#F0F6F1; cursor:pointer; pointer-events:auto; z-index:2147483648; border-radius:4px; padding:2px 4px;">⛶</html:button>
        <html:button id="oasis-assistant-minimize" style="border:0; background:#F0F6F1; cursor:pointer; pointer-events:auto; z-index:2147483648; border-radius:4px; padding:2px 4px;">▁</html:button>
        <html:button id="oasis-assistant-close" style="border:0; background:#F0F6F1; cursor:pointer; pointer-events:auto; z-index:2147483648; border-radius:4px; padding:2px 4px;">✕</html:button>
      </html:div>
      -->
      <browser id="oasis-assistant-overlay-browser" autoscroll="false" disablehistory="true" tooltip="aHTMLTooltip" style="width:100%; height:100%; border:none; background:white; position:relative; z-index:1;"/>
      <!-- Resizer is now dynamically created in browser-sidebar.js
      <html:div id="oasis-assistant-resizer" style="position:absolute; width:18px; height:18px; right:8px; bottom:8px; border-right:2px solid #E5E7EB; border-bottom:2px solid #E5E7EB; background:white; cursor:nwse-resize; z-index:2147483647; pointer-events:auto;"></html:div>
      -->
    </html:div>
  </html:div>
</hbox>
