<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis Browser - OAuth Handler</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 1rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success {
            color: #51cf66;
            font-weight: 600;
        }
        .error {
            color: #ff6b6b;
            font-weight: 600;
        }
        .info {
            color: #74c0fc;
            font-weight: 500;
        }
        .code {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 8px;
            font-family: monospace;
            word-break: break-all;
            margin: 1rem 0;
        }
        .button {
            background: #51cf66;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 1rem 0;
            transition: background 0.2s;
        }
        .button:hover {
            background: #40c057;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div id="status">Processing OAuth callback...</div>
        <div id="details" style="margin-top: 1rem; font-size: 0.9rem; opacity: 0.8;"></div>
        <div id="actions" style="margin-top: 1rem;"></div>
    </div>

    <script>
        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        
        // Check for error
        const error = urlParams.get('error') || hashParams.get('error');
        const errorDescription = urlParams.get('error_description') || hashParams.get('error_description');
        
        // Check for success
        const accessToken = urlParams.get('access_token') || hashParams.get('access_token');
        const refreshToken = urlParams.get('refresh_token') || hashParams.get('refresh_token');
        const code = urlParams.get('code') || hashParams.get('code');
        
        const statusDiv = document.getElementById('status');
        const detailsDiv = document.getElementById('details');
        const actionsDiv = document.getElementById('actions');
        
        if (error) {
            // Handle error
            statusDiv.innerHTML = `<div class="error">Authentication Failed</div>`;
            detailsDiv.innerHTML = `Error: ${error}<br>${errorDescription || ''}`;
            
            // Show instructions to return to assistant
            actionsDiv.innerHTML = `
                <p>Please return to the Oasis Browser assistant and try again.</p>
                <button class="button" onclick="window.close()">Close Window</button>
            `;
            
        } else if (accessToken || code) {
            // Handle success
            statusDiv.innerHTML = `<div class="success">Authentication Successful!</div>`;
            detailsDiv.innerHTML = 'OAuth callback received successfully.';
            
            // Show the auth data for manual copying
            const authData = {
                access_token: accessToken,
                refresh_token: refreshToken,
                code: code,
                timestamp: new Date().toISOString()
            };
            
            actionsDiv.innerHTML = `
                <p><strong>Step 1:</strong> Copy the authentication data below:</p>
                <div class="code" id="authData">${JSON.stringify(authData, null, 2)}</div>
                <button class="button" onclick="copyAuthData()">Copy to Clipboard</button>
                <p><strong>Step 2:</strong> Return to the Oasis Browser assistant and paste this data.</p>
                <button class="button" onclick="window.close()">Close Window</button>
            `;
            
        } else {
            // No auth parameters found
            statusDiv.innerHTML = `<div class="info">OAuth Handler Ready</div>`;
            detailsDiv.innerHTML = 'This page handles OAuth callbacks for Oasis Browser.<br>If you reached this page by mistake, please return to the assistant.';
            
            actionsDiv.innerHTML = `
                <button class="button" onclick="window.close()">Close Window</button>
            `;
        }
        
        function copyAuthData() {
            const authDataText = document.getElementById('authData').textContent;
            navigator.clipboard.writeText(authDataText).then(() => {
                const button = event.target;
                const originalText = button.textContent;
                button.textContent = 'Copied!';
                button.style.background = '#51cf66';
                setTimeout(() => {
                    button.textContent = originalText;
                    button.style.background = '#51cf66';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                alert('Please manually copy the authentication data above.');
            });
        }
    </script>
</body>
</html>
