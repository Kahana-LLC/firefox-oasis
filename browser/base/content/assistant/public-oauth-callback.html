<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oasis OAuth Callback</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f6f7f2;
        margin: 0;
        padding: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #1f2937;
      }
      .container {
        width: 100%;
        max-width: 480px;
        background: white;
        padding: 32px;
        border-radius: 20px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.5;
        color: #4b5563;
      }
      .success {
        color: #4f6f00;
        background: #f2f4e5;
        padding: 12px 14px;
        border-radius: 12px;
        margin: 16px 0;
      }
      .error {
        color: #b42318;
        background: #fef3f2;
        padding: 12px 14px;
        border-radius: 12px;
        margin: 16px 0;
      }
      .code-field {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d0d5dd;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 14px;
        margin: 12px 0;
        background: #fff;
      }
      .copy-button {
        border: none;
        border-radius: 999px;
        background: #708500;
        color: white;
        padding: 12px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .button-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .secondary-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #d0d5dd;
        border-radius: 999px;
        background: #fff;
        color: #344054;
        padding: 12px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 id="statusTitle">OAuth successful</h1>
      <p id="statusMessage">
        Copy the code below, then return to Oasis Assistant to complete sign-in.
      </p>
      <div id="details"></div>
    </div>

    <script>
      const statusTitle = document.getElementById("statusTitle");
      const statusMessage = document.getElementById("statusMessage");
      const detailsDiv = document.getElementById("details");
      const params = new URLSearchParams(window.location.search);
      const code = params.get("code");
      const error = params.get("error");
      const errorDescription = params.get("error_description");
      const assistantUrl = code
        ? `chrome://browser/content/assistant/assistant.xhtml?oauth_code=${encodeURIComponent(code)}`
        : "chrome://browser/content/assistant/assistant.xhtml";

      if (error) {
        statusTitle.textContent = "OAuth failed";
        statusMessage.textContent = "Return to Oasis Assistant and try again.";
        detailsDiv.innerHTML = `<div class="error">${errorDescription || error}</div>`;
      } else if (!code) {
        statusTitle.textContent = "Missing code";
        statusMessage.textContent =
          "No OAuth code was found in this callback URL.";
        detailsDiv.innerHTML =
          '<div class="error">Please restart sign-in from Oasis Assistant.</div>';
      } else {
        detailsDiv.innerHTML = `
                <div class="success">OAuth successful</div>
                <input class="code-field" id="oauth-code" type="text" readonly value="${code}">
                <div class="button-row">
                    <button class="copy-button" id="copy-code-button" type="button">Copy code</button>
                    <a class="secondary-button" id="open-assistant-button" href="${assistantUrl}">Open Oasis Assistant</a>
                </div>
            `;

        document
          .getElementById("copy-code-button")
          .addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(code);
              document.getElementById("copy-code-button").textContent =
                "Copied";
            } catch (e) {
              const field = document.getElementById("oauth-code");
              field.focus();
              field.select();
            }
          });
      }
    </script>
  </body>
</html>
