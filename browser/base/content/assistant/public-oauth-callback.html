<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis Browser - Authentication</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 1rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success { 
            color: #d4edda; 
            background-color: #28a745; 
            border-color: #28a745; 
            padding: 10px; 
            border-radius: 5px; 
            margin: 1rem 0;
        }
        .error { 
            color: #f8d7da; 
            background-color: #dc3545; 
            border-color: #dc3545; 
            padding: 10px; 
            border-radius: 5px; 
            margin: 1rem 0;
        }
        .info {
            color: #d1ecf1;
            background-color: #0c5460;
            border-color: #bee5eb;
            padding: 10px;
            border-radius: 5px;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1 id="statusTitle">Processing Authentication...</h1>
        <p id="statusMessage">Please wait while we securely process your login.</p>
        <div id="details"></div>
    </div>

    <script>
        const statusTitle = document.getElementById('statusTitle');
        const statusMessage = document.getElementById('statusMessage');
        const detailsDiv = document.getElementById('details');

        function getUrlParams() {
            const params = {};
            // Check URL hash first (for implicit flow)
            if (window.location.hash) {
                window.location.hash.substring(1).split('&').forEach(part => {
                    const [key, value] = part.split('=');
                    if (key && value) {
                        params[key] = decodeURIComponent(value);
                    }
                });
            }
            // Check URL search params (for authorization code flow)
            if (window.location.search) {
                window.location.search.substring(1).split('&').forEach(part => {
                    const [key, value] = part.split('=');
                    if (key && value) {
                        params[key] = decodeURIComponent(value);
                    }
                });
            }
            return params;
        }

        const params = getUrlParams();
        console.log('OAuth callback received parameters:', params);

        // 1. PRIORITY CHECK: Recovery Flow
        const isRecovery = params.type === 'recovery' || 
                           window.location.hash.includes('type=recovery') || 
                           window.location.search.includes('type=recovery');

        // Check for recovery (password reset)
        if (isRecovery) {
            statusTitle.textContent = 'Reset Your Password';
            statusMessage.textContent = 'Please enter a new password for your account.';
            
            // Create password reset form
            const form = document.createElement('form');
            form.style.cssText = 'margin-top: 20px; display: flex; flex-direction: column; gap: 15px; align-items: center;';
            
            const passwordInput = document.createElement('input');
            passwordInput.type = 'password';
            passwordInput.placeholder = 'New Password (min 6 chars)';
            passwordInput.required = true;
            passwordInput.minLength = 6;
            passwordInput.style.cssText = 'padding: 10px; width: 100%; max-width: 300px; border-radius: 5px; border: 1px solid #ccc; background: rgba(255,255,255,0.9); color: #333;';
            
            const confirmInput = document.createElement('input');
            confirmInput.type = 'password';
            confirmInput.placeholder = 'Confirm New Password';
            confirmInput.required = true;
            confirmInput.minLength = 6;
            confirmInput.style.cssText = 'padding: 10px; width: 100%; max-width: 300px; border-radius: 5px; border: 1px solid #ccc; background: rgba(255,255,255,0.9); color: #333;';
            
            const submitBtn = document.createElement('button');
            submitBtn.type = 'submit';
            submitBtn.textContent = 'Update Password';
            submitBtn.style.cssText = 'padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; max-width: 320px;';
            
            const messageDiv = document.createElement('div');
            messageDiv.style.cssText = 'margin-top: 10px; font-size: 0.9em;';
            
            form.appendChild(passwordInput);
            form.appendChild(confirmInput);
            form.appendChild(submitBtn);
            form.appendChild(messageDiv);
            
            // Clear spinner and existing content
            document.querySelector('.spinner').style.display = 'none';
            detailsDiv.innerHTML = '';
            detailsDiv.appendChild(form);
            
            // Initialize Supabase client
            // We need the Supabase client here. Since we can't easily import it in this standalone file,
            // we'll use a direct fetch to the Supabase API if possible, or try to load the library from CDN.
            // However, loading from CDN might be blocked by CSP.
            // A better approach for this standalone file is to use the access_token to update the user.
            
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                if (passwordInput.value !== confirmInput.value) {
                    messageDiv.textContent = 'Passwords do not match';
                    messageDiv.style.color = '#ff6b6b';
                    return;
                }
                
                if (passwordInput.value.length < 6) {
                    messageDiv.textContent = 'Password must be at least 6 characters';
                    messageDiv.style.color = '#ff6b6b';
                    return;
                }
                
                submitBtn.disabled = true;
                submitBtn.textContent = 'Updating...';
                messageDiv.textContent = '';
                
                try {
                    // We have the access_token from the URL params
                    const accessToken = params.access_token;
                    
                    if (!accessToken) {
                        throw new Error('No access token found. Link may have expired.');
                    }
                    
                    // Direct API call to Supabase to update user
                    // We need the Supabase URL and Key. 
                    // Since we can't access ENV here, we'll try to find them or ask the user to provide them? 
                    // No, that's bad UX.
                    // We can try to use the same URL as the callback came from? No.
                    
                    // Fallback: We will redirect to a custom protocol that the assistant handles,
                    // passing the new password? No, that's insecure.
                    
                    // BEST APPROACH: We already have the access token. 
                    // We can use the Supabase URL hardcoded here if we know it, 
                    // or try to infer it.
                    // Based on previous files, URL is 'https://wvclepquxxczgrukfqyr.supabase.co'
                    // and Key is in the code.
                    
                    const supabaseUrl = 'https://wvclepquxxczgrukfqyr.supabase.co';
                    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2Y2xlcHF1eHhjemdydWtmcXlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTUwODU5OTksImV4cCI6MjA3MDY2MTk5OX0.T-hZ_8QxtVnOt0mtCY_Zch87SYEcsyQZwnvvFAtZiNY';
                    
                    const response = await fetch(`${supabaseUrl}/auth/v1/user`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${accessToken}`,
                            'apikey': supabaseKey
                        },
                        body: JSON.stringify({
                            password: passwordInput.value
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.msg || data.error_description || 'Failed to update password');
                    }
                    
                    // Success!
                    statusTitle.textContent = 'Password Updated!';
                    statusMessage.innerHTML = `<div class="success">Your password has been reset successfully.</div>`;
                    detailsDiv.innerHTML = '<p>You can now return to Oasis Browser and sign in.</p>';
                    
                    // Try to close window
                    setTimeout(() => {
                        window.close();
                    }, 3000);
                    
                } catch (error) {
                    console.error('Update error:', error);
                    messageDiv.textContent = `Error: ${error.message}`;
                    messageDiv.style.color = '#ff6b6b';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Update Password';
                }
            });
            
        } else if (params.error) {
            // Handle error
            statusTitle.textContent = 'Authentication Failed!';
            statusMessage.innerHTML = `<div class="error">Error: ${params.error_description || params.error}</div>`;
            detailsDiv.innerHTML = 'Please return to the Oasis Browser assistant and try again.';
            
        } else if (params.access_token || params.code) {
            // Handle success
            statusTitle.textContent = 'Authentication Successful!';
            statusMessage.innerHTML = `<div class="success">Redirecting to Oasis Browser...</div>`;
            
            const authData = {
                success: true,
                timestamp: Date.now(),
                access_token: params.access_token,
                refresh_token: params.refresh_token,
                expires_in: params.expires_in,
                token_type: params.token_type,
                code: params.code,
                provider_token: params.provider_token,
                provider_refresh_token: params.provider_refresh_token,
                url: window.location.href
            };
            
            console.log('Auth data prepared:', authData);
            
            // Try to communicate with the assistant
            try {
                // Send success to parent window if available
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'oauth-success',
                        data: authData
                    }, 'chrome://browser/content/assistant/assistant.xhtml');
                    console.log('Sent OAuth success message to opener.');
                }
                
                // Also try to close the window
                setTimeout(() => {
                    window.close();
                }, 2000);
            } catch (e) {
                console.log('Could not communicate with parent window:', e);
                // Fallback: show instructions
                detailsDiv.innerHTML = 'Please return to the Oasis Browser assistant.';
            }
            
        } else {
            // No auth parameters found
            statusTitle.textContent = 'OAuth Handler Ready';
            statusMessage.innerHTML = `<div class="info">This page handles OAuth callbacks for Oasis Browser.</div>`;
            detailsDiv.innerHTML = 'If you reached this page by mistake, please return to the assistant.';
        }
    </script>
</body>
</html>
