<?xml version="1.0"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8"/>
  <title>Assistant</title>
  <style>
    :root { 
      color-scheme: light dark;
      --surface-default: #f8faf2;
      --surface-page: white;
      --primary-green: #7A9200;
      --primary-light: #F8FAF2;
      --primary-50: #F2F4E5;
      --text-body: #666;
      --text-headings: #333;
      --text-secondary: #5b6b4b;
      --neutral-500: #999;
      --border-radius-xlg: 20px;
      --border-radius-lg: 12px;
    }
    body { 
      margin:0; 
      font: 14px 'Geist', system-ui, -apple-system, sans-serif; 
      background: var(--surface-default); 
      color: var(--text-body);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    main { 
      height: 100vh; 
      display:flex; 
      flex-direction:column; 
      background: var(--surface-default);
      padding: 16px;
      gap: 16px;
      resize: none;
      box-sizing: border-box;
    }
    
    /* Hide all resize handles and grippers */
    main::after,
    main::before {
      display: none !important;
      visibility: hidden !important;
    }
    
    /* Make any resize bars transparent */
    splitter,
    resizer,
    grippy,
    .resizer,
    [class*="resize"],
    [class*="gripper"],
    [class*="splitter"] {
      background: transparent !important;
      border: none !important;
      opacity: 0 !important;
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
    
    /* Ensure body doesn't show resize cursor */
    body,
    main {
      cursor: default !important;
    }
    #log { 
      flex:1; 
      padding:16px; 
      padding-bottom: 120px; /* Space for fixed input bar */
      overflow:auto; 
      background: transparent;
      color: var(--text-body);
      border-radius: var(--border-radius-lg);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      scrollbar-width: none;
      gap: 16px; /* Reduced gap for tighter chat */
    }
    
    #log::-webkit-scrollbar {
      display: none;
    }
    
    /* Chat message bubbles */
    .message-bubble {
      display: flex;
      flex-direction: column;
      max-width: 100%;
      animation: fadeIn 0.22s ease-in;
      /* Margin handled by parent gap */
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-user {
      align-items: flex-end;
    }

    .message-ai {
      align-items: flex-start;
    }

    .message-content {
      position: relative;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      /* Text wrapping fixes */
      overflow-wrap: break-word;
      word-wrap: break-word;
      word-break: break-word;
      max-width: 85%; /* Slightly wider default */
      box-shadow: 0 2px 8px rgba(0,0,0,0.04); /* Softer shadow */
      transition: background 120ms ease, transform 120ms ease;
    }

    /* Markdown Styling */
    .message-content p {
      margin: 0 0 8px 0;
    }
    .message-content p:last-child {
      margin-bottom: 0;
    }
    .message-content ul, .message-content ol {
      margin: 4px 0 8px 0;
      padding-left: 20px;
    }
    .message-content li {
      margin-bottom: 4px;
    }
    /* Code blocks - scroll horizontally */
    .message-content pre {
      background: rgba(0,0,0,0.06);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      font-family: monospace;
      font-size: 13px;
      margin: 8px 0;
      white-space: pre;
    }
    /* Inline code */
    .message-content code {
      font-family: monospace;
      background: rgba(0,0,0,0.06);
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .message-content pre code {
      background: none;
      padding: 0;
      border-radius: 0;
      color: inherit;
    }
    .message-content blockquote {
      border-left: 3px solid var(--primary-green);
      margin: 8px 0;
      padding-left: 12px;
      opacity: 0.8;
    }
    /* Headers */
    .message-content h1, .message-content h2, .message-content h3 {
      font-size: 1.1em;
      font-weight: 600;
      margin: 12px 0 6px 0;
    }
    .message-content h1:first-child, .message-content h2:first-child, .message-content h3:first-child {
      margin-top: 0;
    }

    .message-content::selection {
      background-color: #cccccc;
    }

    /* User bubble (right) */
    .message-user .message-content {
      background: linear-gradient(180deg, #F8FAF2, #F2F4E5);
      color: #2f3a20;
      text-align: left;
      border-radius: 18px 18px 4px 18px;
      margin-left: auto; /* Push to right */
    }

    /* AI bubble (left) */
    .message-ai .message-content {
      background: #ffffff;
      color: #333;
      text-align: left;
      border-radius: 18px 18px 18px 4px;
      border: 1px solid rgba(0,0,0,0.05); /* Slightly stronger border */
      margin-right: auto; /* Push to left */
    }

    /* Ensure AI messages can be wider on desktop but not too wide */
    @media (min-width: 800px) {
      .message-ai .message-content { max-width: 65ch; }
      .message-user .message-content { max-width: 50ch; }
    }
    #bar { 
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      display:flex; 
      flex-direction: column;
      gap:8px; 
      padding:16px; 
      padding-right: 24px;
      border: 1px solid white;
      background: var(--surface-page);
      border-radius: var(--border-radius-xlg);
      box-shadow: 0 4px 20px rgba(0,0,0,0.08); /* Stronger shadow for input bar */
      z-index: 100;
    }
    
    #input-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    
    #buttons-row {
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
    }
    
    #buttons-row #feedback-btn {
      margin-right: auto;
    }
    #q { 
      flex:1; 
      min-width: 400px;
      height: 50px;
      padding:12px 16px; 
      border: none;
      border-radius: var(--border-radius-lg);
      font-size: 14px;
      transition: all 0.2s ease;
      background: transparent;
      color: var(--text-body);
      font-family: inherit;
    }
    #q::placeholder {
      color: var(--neutral-500);
      font-size: 14px;
    }
    #q:focus {
      outline: none;
      background: transparent;
    }
    #q:disabled {
      background: var(--primary-50);
      cursor: not-allowed;
      opacity: 0.6;
    }
    
    /* Empty state styling */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex: 1;
      padding: 0 69px;
      margin: auto 0;
    }
    
    #empty-state.hidden {
      display: none;
    }
    
    #empty-state-image {
      width: 199px;
      height: 136px;
      position: relative;
      margin-bottom: 10px;
    }
    
    #empty-state-image img {
      width: 100%;
      height: auto;
      object-fit: contain;
    }
    
    #empty-state-text {
      font-family: 'Geist', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 20px;
      color: var(--neutral-500);
      text-align: center;
      max-width: 366px;
      white-space: pre-wrap;
    }
    
    #empty-state-text p {
      margin: 0;
    }
    
    #empty-state-text p:first-child {
      margin-bottom: 0;
    }
    
    /* Recording inline animation */
    #recording-inline {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 0 4px;
      flex: 1;
    }
    
    #recording-inline.active {
      display: flex;
    }
    
    #input-row.recording #q {
      display: none;
    }
    
    #input-row.recording #recording-inline {
      display: flex;
    }
    
    /* Increase height when recording */
    #input-row.recording {
      min-height: 70px;
    }
    
    .waveform-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1px;
      height: 60px;
      flex: 1;
      padding: 0 8px;
      max-width: 100%;
    }
    
    .waveform-bar {
      flex: 1;
      min-width: 2px;
      max-width: 4px;
      height: 4px;
      background: linear-gradient(180deg, #7A9200, #94A833);
      border-radius: 1.5px;
      transform-origin: center;
      transition: height 0.08s ease-out, opacity 0.08s ease-out;
    }
    
    .recording-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    
    .recording-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      padding: 0;
    }
    
    .recording-btn:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }
    
    .cancel-recording {
      background: #3a3a3a;
      color: #fff;
    }
    
    .accept-recording {
      background: #7A9200;
      color: #fff;
    }
  </style>
</head>
<body>
  <main>
    <div id="log">
      <div id="empty-state">
        <div id="empty-state-image">
          <img src="chrome://browser/content/assistant/images/empty-state-bg.png" alt="Oasis AI"/>
        </div>
        <div id="empty-state-text">
          <p>Welcome to Oasis AI</p>
          <p>Browse, summarize, or manage your browsing tabs here.</p>
        </div>
      </div>
    </div>
    <div id="bar">
      <input id="q" placeholder="Ask me anything…"/>
      <button id="go">Send</button>
    </div>
  </main>

  <script src="chrome://browser/content/assistant/assistant.bundle.js"></script>
  <script src="chrome://browser/content/assistant/auth-guard.js"></script>
  <script src="chrome://browser/content/assistant/assistant.ui.js"></script>

</body>
</html>
