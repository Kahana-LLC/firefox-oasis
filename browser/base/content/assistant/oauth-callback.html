<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis Browser - Authentication</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 1rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success {
            color: #51cf66;
            font-weight: 600;
        }
        .error {
            color: #ff6b6b;
            font-weight: 600;
        }
        .info {
            color: #74c0fc;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div id="status">Processing authentication...</div>
        <div id="details" style="margin-top: 1rem; font-size: 0.9rem; opacity: 0.8;"></div>
    </div>

    <script>
        // Parse URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        
        const SUPABASE_URL = 'https://wvclepquxxczgrukfqyr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2Y2xlcHF1eHhjemdydWtmcXlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTUwODU5OTksImV4cCI6MjA3MDY2MTk5OX0.T-hZ_8QxtVnOt0mtCY_Zch87SYEcsyQZwnvvFAtZiNY';
        
        // Check for error
        const error = urlParams.get('error') || hashParams.get('error');
        const errorDescription = urlParams.get('error_description') || hashParams.get('error_description');
        
        // Check for success
        const accessToken = urlParams.get('access_token') || hashParams.get('access_token');
        const refreshToken = urlParams.get('refresh_token') || hashParams.get('refresh_token');
        const code = urlParams.get('code') || hashParams.get('code');
        const type = urlParams.get('type') || hashParams.get('type');
        
        const statusDiv = document.getElementById('status');
        const detailsDiv = document.getElementById('details');
        
        // Define handleRecoveryFlow before it's used
        async function handleRecoveryFlow() {
            statusDiv.innerHTML = `<div class="success">Reset Your Password</div>`;
            const container = document.querySelector('.container');
            
            // Remove existing form if any
            const existingForm = document.getElementById('recoveryForm');
            if (existingForm) existingForm.remove();
            
            const form = document.createElement('div');
            form.id = 'recoveryForm';
            form.style.marginTop = '1rem';
            form.innerHTML = `
                <input id="newPwd" type="password" placeholder="New password" style="width:100%;padding:0.6rem;border-radius:8px;border:0;outline:none;margin-bottom:0.6rem;color:#333;box-sizing:border-box" />
                <input id="confirmPwd" type="password" placeholder="Confirm new password" style="width:100%;padding:0.6rem;border-radius:8px;border:0;outline:none;margin-bottom:0.6rem;color:#333;box-sizing:border-box" />
                <button id="updateBtn" style="width:100%;padding:0.7rem;border-radius:8px;border:0;background:#51cf66;color:#fff;font-weight:600;cursor:pointer">Update Password</button>
            `;
            container.appendChild(form);
            document.querySelector('.spinner').style.display = 'none';
            
            const btn = form.querySelector('#updateBtn');
            btn.addEventListener('click', async () => {
                const p1 = form.querySelector('#newPwd').value;
                const p2 = form.querySelector('#confirmPwd').value;
                if (!p1 || p1.length < 6) {
                    detailsDiv.innerHTML = 'Password must be at least 6 characters.';
                    return;
                }
                if (p1 !== p2) {
                    detailsDiv.innerHTML = 'Passwords do not match.';
                    return;
                }
                
                btn.disabled = true;
                btn.textContent = 'Updating...';
                detailsDiv.innerHTML = '';
                
                try {
                    // Use dynamic import to avoid blocking load if not available, or use fetch
                    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.47.10');
                    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    
                    if (code) {
                        const { error: exchErr } = await supabase.auth.exchangeCodeForSession(code);
                        if (exchErr) {
                            throw new Error(exchErr.message);
                        }
                    } else if (accessToken && refreshToken) {
                        const { error: setErr } = await supabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
                        if (setErr) {
                            throw new Error(setErr.message);
                        }
                    } else if (accessToken) {
                        // Just access token might be enough for updateUser if valid
                        // But supabase-js usually needs a session.
                        // We can try to set it.
                    }
                    
                    const { data, error: updErr } = await supabase.auth.updateUser({ password: p1 });
                    
                    if (updErr) {
                        throw new Error(updErr.message);
                    }
                    
                    statusDiv.innerHTML = `<div class="success">Password updated successfully!</div>`;
                    detailsDiv.innerHTML = 'You can now return to Oasis and sign in.';
                    form.remove();
                    
                    // Try to close window
                    setTimeout(() => {
                        window.close();
                    }, 3000);
                    
                } catch (e) {
                    console.error(e);
                    statusDiv.innerHTML = `<div class="error">Update Failed</div>`;
                    detailsDiv.innerHTML = e?.message || String(e);
                    btn.disabled = false;
                    btn.textContent = 'Update Password';
                }
            });
        }
        
        // 1. PRIORITY CHECK: Recovery Flow
        // We check strictly for 'recovery' in the type param or URL
        const isRecovery = (type && type.toLowerCase() === 'recovery') || 
                           window.location.href.toLowerCase().includes('type=recovery') ||
                           window.location.hash.toLowerCase().includes('type=recovery') || 
                           window.location.search.toLowerCase().includes('type=recovery');

        // Check for recovery (password reset)
        if (isRecovery) {
            console.log('Recovery flow detected');
            handleRecoveryFlow();
        } else if (error) {
            // Handle error
            statusDiv.innerHTML = `<div class="error">Authentication Failed</div>`;
            detailsDiv.innerHTML = `Error: ${error}<br>${errorDescription || ''}`;
            
            // Try to communicate with the assistant
            try {
                // Send error to parent window if available
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'oauth-error',
                        error: error,
                        description: errorDescription
                    }, '*');
                }
                
                // Also try to close the window
                setTimeout(() => {
                    window.close();
                }, 3000);
            } catch (e) {
                console.log('Could not communicate with parent window:', e);
            }
            
        } else if (accessToken || code) {
            // Handle success
            statusDiv.innerHTML = `<div class="success">Authentication Successful!</div>`;
            detailsDiv.innerHTML = 'Redirecting to Oasis Browser...';
            
            // Prepare auth data
            const authData = {
                access_token: accessToken,
                refresh_token: refreshToken,
                code: code,
                type: urlParams.get('type') || hashParams.get('type') || null,
                url: window.location.href,
                timestamp: new Date().toISOString()
            };
            
            // Try to communicate with the assistant
            try {
                // Send success to parent window if available
                if (window.opener) {
                    // window.opener.postMessage({
                    //     type: 'oauth-success',
                    //     data: authData
                    // }, '*');

                    window.opener.postMessage({
                        type: isRecovery ? 'oauth-recovery' : 'oauth-success',
                        data: authData
                    }, '*');


                }
                
                // Also try to close the window
                setTimeout(() => {
                    window.close();
                }, 2000);
            } catch (e) {
                console.log('Could not communicate with parent window:', e);
                // Fallback: show instructions
                detailsDiv.innerHTML = 'Please return to the Oasis Browser assistant.';
            }
            
        } else {
            // No auth parameters found
            statusDiv.innerHTML = `<div class="info">OAuth Handler Ready</div>`;
            detailsDiv.innerHTML = 'This page handles OAuth callbacks for Oasis Browser.<br>If you reached this page by mistake, please return to the assistant.';
            
            setTimeout(() => {
                try {
                    window.close();
                } catch (e) {
                    detailsDiv.innerHTML += '<br><br>Please return to the Oasis Browser assistant manually.';
                }
            }, 5000);
        }
    </script>
</body>
</html>
