<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oasis Browser - Authentication Callback</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: white;
      }
      .container {
        text-align: center;
        background: rgba(255, 255, 255, 0.1);
        padding: 2rem;
        border-radius: 1rem;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        max-width: 28rem;
      }
      .spinner {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid white;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      #status {
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="spinner" aria-hidden="true"></div>
      <div id="status">Completing sign-in...</div>
    </div>

    <script>
      const ALLOWED_TARGETS = {
        assistant: "chrome://browser/content/assistant/assistant.xhtml",
        onboarding: "chrome://browser/content/oasiswelcome/oasiswelcome.html",
      };

      const urlParams = new URLSearchParams(window.location.search);
      const rawTarget = urlParams.get("target");
      const target =
        rawTarget && Object.hasOwn(ALLOWED_TARGETS, rawTarget)
          ? rawTarget
          : "assistant";

      const statusEl = document.getElementById("status");
      statusEl.textContent = "Returning to Oasis Browser...";

      setTimeout(() => {
        window.location.href = ALLOWED_TARGETS[target];
      }, 500);
    </script>
  </body>
</html>
