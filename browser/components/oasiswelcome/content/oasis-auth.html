<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oasis - Sign In</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #f5f5dc 0%, #ffffff 50%, #e8f5e9 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      padding: 48px;
      width: 100%;
      max-width: 440px;
      animation: slideUp 0.4s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #7a9200, #a5c01f);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: white;
      font-weight: bold;
    }

    .auth-title {
      font-size: 28px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .auth-subtitle {
      font-size: 15px;
      color: #666;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      font-size: 14px;
      font-weight: 500;
      color: #333;
    }

    .form-input {
      padding: 12px 16px;
      border: 1.5px solid #e0e0e0;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.2s ease;
      background: white;
      color: #1a1a1a;
    }

    .form-input:focus {
      outline: none;
      border-color: #7a9200;
      box-shadow: 0 0 0 3px rgba(122, 146, 0, 0.1);
    }

    .form-input::placeholder {
      color: #999;
      opacity: 1;
    }

    .error-message {
      padding: 12px 16px;
      background: #ffebee;
      color: #d32f2f;
      border-radius: 12px;
      font-size: 14px;
      display: none;
    }

    .error-message.visible {
      display: block;
    }

    .success-message {
      padding: 12px 16px;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 12px;
      font-size: 14px;
      display: none;
    }

    .success-message.visible {
      display: block;
    }

    .submit-button {
      padding: 14px 24px;
      background: #7a9200;
      color: white;
      border: none;
      border-radius: 64px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .submit-button:hover:not(:disabled) {
      background: #6a8000;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(122, 146, 0, 0.3);
    }

    .submit-button:active:not(:disabled) {
      transform: translateY(0);
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .auth-toggle {
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-top: 24px;
    }

    .auth-toggle-link {
      color: #7a9200;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .auth-toggle-link:hover {
      text-decoration: underline;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-indicator {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <div class="logo">O</div>
      <h1 class="auth-title" id="auth-title">Create Account</h1>
      <p class="auth-subtitle" id="auth-subtitle">Sign up to sync your tabs and access AI assistant</p>
    </div>

    <div id="loading-indicator" class="loading-indicator" style="display: none;">
      <div class="spinner"></div>
      <span>Loading authentication service...</span>
    </div>

    <form class="auth-form" id="auth-form">
      <div class="form-field">
        <label class="form-label" for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          class="form-input" 
          placeholder="your@email.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-field">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          placeholder="Enter your password"
          required
          autocomplete="current-password"
        />
      </div>

      <div class="error-message" id="error-message"></div>
      <div class="success-message" id="success-message"></div>

      <button type="submit" class="submit-button" id="submit-button">
        <span id="submit-text">Sign Up</span>
      </button>
    </form>

    <div class="auth-toggle" id="auth-toggle">
      <span id="toggle-text">Already have an account?</span>
      <a class="auth-toggle-link" id="toggle-link">Sign In</a>
    </div>

    <!-- Success State -->
    <div id="success-state" style="display: none; text-align: center; padding: 20px 0;">
      <div class="success-message" style="display: block; margin-bottom: 24px;" id="final-success-message"></div>
      <p style="color: #666; font-size: 14px; margin-bottom: 24px;">You can close this page or click Done to continue browsing.</p>
      <button class="submit-button" id="done-button" style="min-width: 200px;">
        Done
      </button>
    </div>
  </div>

  <!-- Load Supabase Auth from Assistant Bundle -->
  <script src="chrome://browser/content/assistant/assistant.bundle.js"></script>
  
  <script>
    "use strict";

    let authMode = 'signup';
    const LOGIN_HOSTNAME = "https://kahana.co";
    const LOGIN_REALM = "Oasis Assistant";
    const LOGIN_USERNAME = "oasis_assistant_session";

    const authForm = document.getElementById('auth-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitButton = document.getElementById('submit-button');
    const submitText = document.getElementById('submit-text');
    const errorMessage = document.getElementById('error-message');
    const successMessage = document.getElementById('success-message');
    const authTitle = document.getElementById('auth-title');
    const authSubtitle = document.getElementById('auth-subtitle');
    const toggleText = document.getElementById('toggle-text');
    const toggleLink = document.getElementById('toggle-link');
    const loadingIndicator = document.getElementById('loading-indicator');
    const authToggle = document.getElementById('auth-toggle');
    const successState = document.getElementById('success-state');
    const finalSuccessMessage = document.getElementById('final-success-message');
    const doneButton = document.getElementById('done-button');

    async function securelySaveSession(session) {
      if (!session || !session.access_token) return;
      try {
        const logins = Services.logins.findLogins(LOGIN_HOSTNAME, null, LOGIN_REALM);
        for (const login of logins) {
          if (login.username === LOGIN_USERNAME) {
            Services.logins.removeLogin(login);
          }
        }

        const loginInfo = new Components.Constructor(
          "@mozilla.org/login-manager/loginInfo;1",
          Ci.nsILoginInfo,
          "init"
        )(
          LOGIN_HOSTNAME,
          null,
          LOGIN_REALM,
          LOGIN_USERNAME,
          JSON.stringify({
            access_token: session.access_token,
            refresh_token: session.refresh_token,
            expires_at: session.expires_at,
            user: session.user
          }),
          "",
          ""
        );
        await Services.logins.addLoginAsync(loginInfo);
        console.log("Oasis Auth: Session securely saved");
      } catch (e) {
        console.error("Oasis Auth: Failed to save session:", e);
      }
    }

    function updateAuthUI() {
      if (authMode === 'signup') {
        authTitle.textContent = 'Create Account';
        authSubtitle.textContent = 'Sign up to sync your tabs and access AI assistant';
        submitText.textContent = 'Sign Up';
        toggleText.textContent = 'Already have an account?';
        toggleLink.textContent = 'Sign In';
      } else {
        authTitle.textContent = 'Welcome Back';
        authSubtitle.textContent = 'Sign in to your Oasis account';
        submitText.textContent = 'Sign In';
        toggleText.textContent = "Don't have an account?";
        toggleLink.textContent = 'Sign Up';
      }
      errorMessage.classList.remove('visible');
      successMessage.classList.remove('visible');
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.add('visible');
      successMessage.classList.remove('visible');
    }

    function showSuccess(message) {
      successMessage.textContent = message;
      successMessage.classList.add('visible');
      errorMessage.classList.remove('visible');
    }

    async function waitForSupabaseAuth() {
      let attempts = 0;
      while (!window.supabaseAuth && attempts < 100) {
        await new Promise(resolve => setTimeout(resolve, 100));
        attempts++;
      }
      return window.supabaseAuth;
    }

    toggleLink.addEventListener('click', (e) => {
      e.preventDefault();
      authMode = authMode === 'signup' ? 'signin' : 'signup';
      updateAuthUI();
    });

    doneButton.addEventListener('click', () => {
      try {
        if (typeof Services !== 'undefined' && Services.wm) {
          // Open about:home in a new tab
          const win = Services.wm.getMostRecentWindow('navigator:browser');
          if (win && win.gBrowser) {
            const newTab = win.gBrowser.addTrustedTab('about:home', {
              triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal(),
              inBackground: false,
            });
            win.gBrowser.selectedTab = newTab;
            
            // Close the auth tab
            const authTab = win.gBrowser.getTabForBrowser(window.docShell);
            if (authTab) {
              win.gBrowser.removeTab(authTab);
            }
            return;
          }
        }
        // Fallback: just navigate to about:home
        window.location.href = 'about:home';
      } catch (e) {
        console.error('Failed to open new tab:', e);
        // Fallback: just navigate to about:home
        window.location.href = 'about:home';
      }
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('Please enter both email and password');
        return;
      }

      submitButton.disabled = true;
      submitText.innerHTML = '<span class="spinner"></span>Processing...';
      errorMessage.classList.remove('visible');
      successMessage.classList.remove('visible');

      try {
        const supabaseAuth = await waitForSupabaseAuth();
        
        if (!supabaseAuth) {
          throw new Error('Authentication service not available');
        }

        let result;
        if (authMode === 'signup') {
          result = await supabaseAuth.signUp(email, password, email.split('@')[0]);
        } else {
          result = await supabaseAuth.signInWithEmail(email, password);
        }

        const { user, error } = result;

        if (error) {
          throw error;
        }

        if (user) {
          console.log('Authentication successful:', user.email || user.id);
          
          const { data: sessionData } = await supabaseAuth.getSession();
          if (sessionData && sessionData.session) {
            await securelySaveSession(sessionData.session);
          }
          
          window.oasisAuthState = {
            isAuthenticated: true,
            user: user
          };
          
          try {
            window.dispatchEvent(new CustomEvent('oasis-auth-update', {
              detail: window.oasisAuthState
            }));
          } catch (e) {
            console.warn('Failed to dispatch auth update event', e);
          }
          
          // Hide form and show success state
          authForm.style.display = 'none';
          authToggle.style.display = 'none';
          successMessage.classList.remove('visible'); // Hide inline success message
          successState.style.display = 'block';
          finalSuccessMessage.textContent = `✓ Signed in as ${user.email || user.id}`;
          finalSuccessMessage.style.display = 'block';
        } else {
          showError('Authentication failed. Please try again.');
          submitButton.disabled = false;
          submitText.textContent = authMode === 'signup' ? 'Sign Up' : 'Sign In';
        }
      } catch (error) {
        console.error('Auth error:', error);
        showError(error.message || 'An error occurred during authentication');
        submitButton.disabled = false;
        submitText.textContent = authMode === 'signup' ? 'Sign Up' : 'Sign In';
      }
    });

    (async function init() {
      loadingIndicator.style.display = 'block';
      authForm.style.display = 'none';
      
      const supabaseAuth = await waitForSupabaseAuth();
      
      if (supabaseAuth) {
        console.log('Supabase Auth service loaded successfully');
        loadingIndicator.style.display = 'none';
        authForm.style.display = 'flex';
      } else {
        loadingIndicator.innerHTML = '<div style="color: #d32f2f;">Failed to load authentication service. Please refresh the page.</div>';
      }
    })();
  </script>
</body>
</html>
