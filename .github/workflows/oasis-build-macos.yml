name: Oasis macOS Build

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      build_target:
        required: true
        type: string
      arch_slug:
        required: true
        type: string
      runner:
        required: true
        type: string
      objdir:
        required: true
        type: string
      update_channel:
        required: true
        type: string
      ring:
        required: true
        type: string

permissions:
  contents: read

env:
  PRODUCT: Firefox
  LOCALE: en-US
  OASIS_RCODESIGN_VERSION: 0.27.0

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    environment: canary-signing
    env:
      OBJDIR: ${{ inputs.objdir }}
      BUILD_TARGET: ${{ inputs.build_target }}
      ARCH_SLUG: ${{ inputs.arch_slug }}
      RING: ${{ inputs.ring }}
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ format('refs/tags/{0}', inputs.release_tag) }}

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          if ! [[ "${TAG}" =~ ^v[0-9]+(\.[0-9]+){3}$ ]]; then
            echo "Tag must match vX.Y.Z.N (numeric dot notation)." >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then
            echo "Version must match X.Y.Z.N (numeric dot notation)." >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Export build overrides
        env:
          OASIS_UPDATE_SERVICE_URL: ${{ secrets.OASIS_UPDATE_SERVICE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${OASIS_UPDATE_SERVICE_URL:-}" ]; then
            echo "Missing OASIS_UPDATE_SERVICE_URL for build overrides." >&2
            exit 1
          fi
          VERSION="${{ steps.version.outputs.version }}"
          UPDATE_URL="${OASIS_UPDATE_SERVICE_URL%/}/update/6/%PRODUCT%/%VERSION%/%BUILD_ID%/%BUILD_TARGET%/%LOCALE%/%CHANNEL%/%OS_VERSION%/%SYSTEM_CAPABILITIES%/%DISTRIBUTION%/%DISTRIBUTION_VERSION%/update.xml"
          echo "OASIS_APP_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "OASIS_APP_VERSION_DISPLAY=${VERSION}" >> "${GITHUB_ENV}"
          echo "MOZ_APPUPDATE_URL=${UPDATE_URL}" >> "${GITHUB_ENV}"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            browser/base/content/assistant/build/package-lock.json
            browser/base/content/assistant/ui-preact/package-lock.json

      - name: Restore rcodesign cache
        uses: actions/cache@v5
        with:
          path: ~/.local/rcodesign
          key: ${{ runner.os }}-${{ runner.arch }}-rcodesign-${{ env.OASIS_RCODESIGN_VERSION }}-v1

      - name: Build assistant bundles
        run: |
          set -euo pipefail
          npm ci --prefix browser/base/content/assistant/ui-preact
          npm run build --prefix browser/base/content/assistant/ui-preact
          npm ci --prefix browser/base/content/assistant/build
          npm run test:search-history --prefix browser/base/content/assistant/build
          npm run build --prefix browser/base/content/assistant/build

      - name: Check DMG layout env present
        run: |
          set -euo pipefail
          f=browser/branding/custom/build/dmg-cluster-width.env
          if [[ ! -f "${f}" ]]; then
            echo "error: ${f} missing on ref ${{ github.ref }}" >&2
            exit 1
          fi

      - name: Verify Oasis branding icons
        run: |
          set -euo pipefail
          ./browser/branding/custom/verify_branding_icons.sh

      - name: Create CI mozconfig
        run: |
          set -euo pipefail
          CI_MOZCONFIG="${RUNNER_TEMP}/mozconfig-oasis-build"
          cat > "${CI_MOZCONFIG}" <<EOF
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/${{ inputs.objdir }}
          ac_add_options --enable-application=browser
          ac_add_options --with-branding=browser/branding/custom
          ac_add_options --enable-release
          ac_add_options --disable-debug
          ac_add_options --enable-optimize
          ac_add_options --disable-crashreporter
          ac_add_options --enable-updater
          ac_add_options --enable-update-channel=${{ inputs.update_channel }}
          export MOZ_PKG_APPNAME=oasis
          export MOZ_INCLUDE_SOURCE_INFO=
          export MOZ_DISABLE_SOURCE_INFO=1
          EOF
          echo "MOZCONFIG=${CI_MOZCONFIG}" >> "${GITHUB_ENV}"

      - name: Select Xcode 26.2
        run: |
          set -euo pipefail
          XCODE_DEVELOPER_DIR="/Applications/Xcode_26.2.app/Contents/Developer"
          if [ ! -d "${XCODE_DEVELOPER_DIR}" ]; then
            echo "Missing Xcode 26.2 at ${XCODE_DEVELOPER_DIR}" >&2
            exit 1
          fi
          sudo xcode-select -s "${XCODE_DEVELOPER_DIR}"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install rcodesign
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH}" in
            ARM64)
              PRIMARY_ARCH="aarch64-apple-darwin"
              FALLBACK_ARCH="x86_64-apple-darwin"
              ;;
            X64)
              PRIMARY_ARCH="x86_64-apple-darwin"
              FALLBACK_ARCH="aarch64-apple-darwin"
              ;;
            *)
              echo "Unsupported RUNNER_ARCH: ${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac

          RELEASE_BASE="https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${OASIS_RCODESIGN_VERSION}"
          INSTALL_ROOT="${HOME}/.local/rcodesign/${OASIS_RCODESIGN_VERSION}"

          install_rcodesign() {
            local target_arch="$1"
            local install_dir="${INSTALL_ROOT}/${target_arch}"
            local tar_name="apple-codesign-${OASIS_RCODESIGN_VERSION}-${target_arch}.tar.gz"
            local tar_url="${RELEASE_BASE}/${tar_name}"
            local sha_url="${tar_url}.sha256"

            mkdir -p "${install_dir}"
            if [ -x "${install_dir}/rcodesign" ]; then
              echo "Using cached rcodesign from ${install_dir}"
              export PATH="${install_dir}:${PATH}"
              echo "${install_dir}" >> "${GITHUB_PATH}"
              echo "OASIS_RCODESIGN_BIN=${install_dir}/rcodesign" >> "${GITHUB_ENV}"
              return 0
            fi

            tmpdir="$(mktemp -d)"

            curl -fL "${tar_url}" -o "${tmpdir}/${tar_name}" || {
              rm -rf "${tmpdir}"
              return 1
            }
            curl -fL "${sha_url}" -o "${tmpdir}/${tar_name}.sha256" || {
              rm -rf "${tmpdir}"
              return 1
            }

            expected_sha="$(awk '{print $1}' "${tmpdir}/${tar_name}.sha256" | tr -d '\r\n')"
            if ! [[ "${expected_sha}" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "Invalid SHA256 content in ${tar_name}.sha256: ${expected_sha}" >&2
              rm -rf "${tmpdir}"
              return 1
            fi
            actual_sha="$(shasum -a 256 "${tmpdir}/${tar_name}" | awk '{print $1}')"
            if [ "${actual_sha}" != "${expected_sha}" ]; then
              echo "SHA256 mismatch for ${tar_name}" >&2
              rm -rf "${tmpdir}"
              return 1
            fi

            tar -xzf "${tmpdir}/${tar_name}" -C "${tmpdir}" || {
              rm -rf "${tmpdir}"
              return 1
            }
            rcodesign_path="$(find "${tmpdir}" -type f -name rcodesign | head -n1)"
            if [ -z "${rcodesign_path}" ]; then
              echo "rcodesign binary missing from ${tar_name}" >&2
              rm -rf "${tmpdir}"
              return 1
            fi

            cp "${rcodesign_path}" "${install_dir}/rcodesign" || {
              rm -rf "${tmpdir}"
              return 1
            }
            chmod 755 "${install_dir}/rcodesign"
            rm -rf "${tmpdir}"
            export PATH="${install_dir}:${PATH}"
            echo "${install_dir}" >> "${GITHUB_PATH}"
            echo "OASIS_RCODESIGN_BIN=${install_dir}/rcodesign" >> "${GITHUB_ENV}"
            return 0
          }

          if ! install_rcodesign "${PRIMARY_ARCH}"; then
            echo "Primary rcodesign archive failed, trying fallback ${FALLBACK_ARCH}." >&2
            install_rcodesign "${FALLBACK_ARCH}"
          fi

          command -v rcodesign
          rcodesign --version

      - name: Probe rcodesign CLI
        run: |
          set -euo pipefail
          if ! rcodesign sign --help | grep -Eq -- "--entitlements-xml-(path|file)"; then
            echo "Installed rcodesign is missing entitlements XML flag support." >&2
            exit 1
          fi
          if ! rcodesign sign --help | grep -q -- "--p12-password-file"; then
            echo "Installed rcodesign is missing --p12-password-file support." >&2
            exit 1
          fi

      - name: Prepare Apple signing keychain
        env:
          OASIS_APPLE_DEVELOPER_ID_P12_B64: ${{ secrets.OASIS_APPLE_DEVELOPER_ID_P12_B64 }}
          OASIS_APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.OASIS_APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${OASIS_APPLE_DEVELOPER_ID_P12_B64}" ] || [ -z "${OASIS_APPLE_DEVELOPER_ID_P12_PASSWORD}" ]; then
            echo "Missing Apple Developer ID certificate secrets." >&2
            exit 1
          fi
          KEYCHAIN_PATH="${RUNNER_TEMP}/oasis-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          P12_PATH="${RUNNER_TEMP}/oasis-developer-id.p12"
          P12_PASSWORD_FILE="${RUNNER_TEMP}/oasis-developer-id-password.txt"

          python3 -c 'import base64, os, sys; sys.stdout.buffer.write(base64.b64decode(os.environ["OASIS_APPLE_DEVELOPER_ID_P12_B64"]))' > "${P12_PATH}"
          printf '%s' "${OASIS_APPLE_DEVELOPER_ID_P12_PASSWORD}" > "${P12_PASSWORD_FILE}"
          chmod 600 "${P12_PATH}" "${P12_PASSWORD_FILE}"

          ORIGINAL_KEYCHAINS="$(security list-keychains -d user | tr -d '"')"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" ${ORIGINAL_KEYCHAINS}
          security default-keychain -d user -s "${KEYCHAIN_PATH}"
          security import "${P12_PATH}" -k "${KEYCHAIN_PATH}" -P "${OASIS_APPLE_DEVELOPER_ID_P12_PASSWORD}" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          echo "OASIS_APPLE_KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"
          echo "OASIS_APPLE_KEYCHAIN_PASSWORD=${KEYCHAIN_PASSWORD}" >> "${GITHUB_ENV}"
          echo "OASIS_APPLE_DEVELOPER_ID_P12_PATH=${P12_PATH}" >> "${GITHUB_ENV}"
          echo "OASIS_APPLE_DEVELOPER_ID_P12_PASSWORD_FILE=${P12_PASSWORD_FILE}" >> "${GITHUB_ENV}"
          echo "OASIS_APPLE_KEYCHAIN_ORIGINAL_LIST<<EOF" >> "${GITHUB_ENV}"
          echo "${ORIGINAL_KEYCHAINS}" >> "${GITHUB_ENV}"
          echo "EOF" >> "${GITHUB_ENV}"

      - name: Validate PKCS12 with password file
        run: |
          set -euo pipefail
          openssl pkcs12 \
            -in "${OASIS_APPLE_DEVELOPER_ID_P12_PATH}" \
            -passin "file:${OASIS_APPLE_DEVELOPER_ID_P12_PASSWORD_FILE}" \
            -nokeys -noout >/dev/null

      - name: Build and stage package
        run: |
          set -euo pipefail
          unset MOZ_AUTOMATION
          ./mach build
          make -C "${OBJDIR}/browser/installer" stage-package

          MOZ_PKG_DIR=$(make -s -C "${OBJDIR}/browser/installer" echo-variable-MOZ_PKG_DIR)
          APP_NAME=$(make -s -C "${OBJDIR}/browser/installer" echo-variable-_APPNAME)
          PACKAGE=$(make -s -C "${OBJDIR}/browser/installer" echo-variable-PACKAGE)
          VOLUME_NAME=$(make -s -C "${OBJDIR}/browser/installer" echo-variable-MOZ_APP_DISPLAYNAME)
          DSSTORE_PATH=$(make -s -C "${OBJDIR}/browser/installer" echo-variable-MOZ_PKG_MAC_DSSTORE || true)
          BACKGROUND_PATH=$(make -s -C "${OBJDIR}/browser/installer" echo-variable-MOZ_PKG_MAC_BACKGROUND || true)
          ICON_PATH=$(make -s -C "${OBJDIR}/browser/installer" echo-variable-MOZ_PKG_MAC_ICON || true)

          PKG_APP="${OBJDIR}/dist/${MOZ_PKG_DIR}/${APP_NAME}"
          DMG_PATH="${OBJDIR}/dist/${PACKAGE}"

          echo "PKG_APP=${PKG_APP}" >> "${GITHUB_ENV}"
          echo "DMG_PATH=${DMG_PATH}" >> "${GITHUB_ENV}"
          echo "MOZ_PKG_DIR=${MOZ_PKG_DIR}" >> "${GITHUB_ENV}"
          echo "VOLUME_NAME=${VOLUME_NAME}" >> "${GITHUB_ENV}"
          echo "DSSTORE_PATH=${DSSTORE_PATH}" >> "${GITHUB_ENV}"
          echo "BACKGROUND_PATH=${BACKGROUND_PATH}" >> "${GITHUB_ENV}"
          echo "ICON_PATH=${ICON_PATH}" >> "${GITHUB_ENV}"

      - name: Verify staged version
        id: meta
        run: |
          set -euo pipefail
          APP_INI="${PKG_APP}/Contents/Resources/application.ini"
          EXPECTED_VERSION="${{ steps.version.outputs.version }}"
          VERSION="$(awk -F= '/^Version=/{print $2}' "${APP_INI}")"
          BUILD_ID="$(awk -F= '/^BuildID=/{print $2}' "${APP_INI}")"

          if [ "${VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "Staged version mismatch: expected ${EXPECTED_VERSION}, got ${VERSION}" >&2
            exit 1
          fi
          EXECUTABLE_PATH=""
          for candidate in Oasis firefox firefox-bin; do
            if [ -f "${PKG_APP}/Contents/MacOS/${candidate}" ]; then
              EXECUTABLE_PATH="${PKG_APP}/Contents/MacOS/${candidate}"
              break
            fi
          done
          if [ -z "${EXECUTABLE_PATH}" ]; then
            echo "Could not find executable under ${PKG_APP}/Contents/MacOS" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "build_id=${BUILD_ID}" >> "${GITHUB_OUTPUT}"
          echo "executable_path=${EXECUTABLE_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Validate staged update URL
        env:
          OASIS_UPDATE_SERVICE_URL: ${{ secrets.OASIS_UPDATE_SERVICE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${OASIS_UPDATE_SERVICE_URL:-}" ]; then
            echo "Missing OASIS_UPDATE_SERVICE_URL secret for update URL validation." >&2
            exit 1
          fi

          APP_INI="${PKG_APP}/Contents/Resources/application.ini"
          UPDATE_URL="$(awk -F= '/^URL=/{print $2; exit}' "${APP_INI}")"
          if [ -z "${UPDATE_URL}" ]; then
            echo "App update URL missing in ${APP_INI}" >&2
            exit 1
          fi
          if [[ "${UPDATE_URL}" == *"aus5.mozilla.org"* ]]; then
            echo "App update URL still points to Mozilla AUS: ${UPDATE_URL}" >&2
            exit 1
          fi

          SERVICE_BASE="${OASIS_UPDATE_SERVICE_URL%/}"
          EXPECTED_PREFIX="${SERVICE_BASE}/update/6/"
          if [[ "${UPDATE_URL}" != "${EXPECTED_PREFIX}"* ]]; then
            echo "App update URL does not point to Oasis update service." >&2
            exit 1
          fi
          if [[ "${UPDATE_URL}" != *"/%CHANNEL%/"* ]]; then
            echo "App update URL missing %CHANNEL% placeholder: ${UPDATE_URL}" >&2
            exit 1
          fi

      - name: Prepare and sign app bundle (rcodesign)
        run: |
          set -euo pipefail
          find "${PKG_APP}" \( -name ".mkdir.done" -o -name "*.done" \) -delete
          if find "${PKG_APP}" -type l -print -quit | grep -q .; then
            echo "Refusing to sign app with symlinks still present: ${PKG_APP}" >&2
            exit 1
          fi
          ./mach macos-sign \
            -a "${PKG_APP}" \
            -r \
            -f "${OASIS_APPLE_DEVELOPER_ID_P12_PATH}" \
            -p "${OASIS_APPLE_DEVELOPER_ID_P12_PASSWORD_FILE}" \
            -e production \
            -c release \
            -v
          codesign --verify --deep --strict --verbose=2 "${PKG_APP}"

      - name: Verify passkey entitlement on signed app
        run: |
          set -euo pipefail
          EXECUTABLE_PATH="${{ steps.meta.outputs.executable_path }}"
          if [ -z "${EXECUTABLE_PATH}" ] || [ ! -f "${EXECUTABLE_PATH}" ]; then
            echo "Missing executable for passkey entitlement check" >&2
            exit 1
          fi
          ENTITLEMENTS="$(codesign -d --entitlements :- "${EXECUTABLE_PATH}" 2>/dev/null || true)"
          if ! echo "${ENTITLEMENTS}" | grep -q 'com.apple.developer.web-browser.public-key-credential'; then
            echo "com.apple.developer.web-browser.public-key-credential missing from signed app" >&2
            echo "${ENTITLEMENTS}" >&2
            exit 1
          fi
          echo "Passkey entitlement verified on ${EXECUTABLE_PATH}"

      - name: Prepare notary API key
        env:
          OASIS_APPLE_API_KEY_ID: ${{ secrets.OASIS_APPLE_API_KEY_ID }}
          OASIS_APPLE_API_ISSUER: ${{ secrets.OASIS_APPLE_API_ISSUER }}
          OASIS_APPLE_API_KEY_P8_B64: ${{ secrets.OASIS_APPLE_API_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${OASIS_APPLE_API_KEY_ID}" ] || [ -z "${OASIS_APPLE_API_ISSUER}" ] || [ -z "${OASIS_APPLE_API_KEY_P8_B64}" ]; then
            echo "Missing one or more App Store Connect API key secrets." >&2
            exit 1
          fi
          NOTARY_KEY_PATH="${RUNNER_TEMP}/AuthKey_${OASIS_APPLE_API_KEY_ID}.p8"
          python3 -c 'import base64, os, sys; sys.stdout.buffer.write(base64.b64decode(os.environ["OASIS_APPLE_API_KEY_P8_B64"]))' > "${NOTARY_KEY_PATH}"
          chmod 600 "${NOTARY_KEY_PATH}"
          echo "OASIS_NOTARY_KEY_PATH=${NOTARY_KEY_PATH}" >> "${GITHUB_ENV}"
          echo "OASIS_APPLE_API_KEY_ID=${OASIS_APPLE_API_KEY_ID}" >> "${GITHUB_ENV}"
          echo "OASIS_APPLE_API_ISSUER=${OASIS_APPLE_API_ISSUER}" >> "${GITHUB_ENV}"

      - name: Notarize and staple app bundle
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          NOTARY_ZIP="${RUNNER_TEMP}/oasis-app-notary-${VERSION}-${ARCH_SLUG}.zip"
          ditto -c -k --keepParent "${PKG_APP}" "${NOTARY_ZIP}"

          ZIP_SIZE="$(stat -f%z "${NOTARY_ZIP}")"
          if [ "${ZIP_SIZE}" -lt 52428800 ]; then
             echo "ZIP payload too small." >&2; exit 1
          fi
          if command -v zipinfo >/dev/null 2>&1; then
            ZIP_ENTRIES="$(zipinfo -1 "${NOTARY_ZIP}")"
          else
            ZIP_ENTRIES="$(unzip -Z1 "${NOTARY_ZIP}")"
          fi
          if echo "${ZIP_ENTRIES}" | grep -q "^__MACOSX/"; then
            echo "ZIP payload contains __MACOSX, refusing notarization submit." >&2
            exit 1
          fi
          if ! echo "${ZIP_ENTRIES}" | grep -Eq '/Contents/MacOS/(Oasis|firefox|firefox-bin)$'; then
            echo "ZIP payload missing expected executable under Contents/MacOS." >&2
            exit 1
          fi

          max_attempts=12
          backoffs=(30 60 120 180 240 300 300 300 300 300 300)
          RETRYABLE_NOTARY_RE='statusCode: 50[0-4]|HTTP status code: 50[0-4]|UNEXPECTED_ERROR|HTTP status code: 408|HTTP status code: 429|NSURLErrorDomain Code=-(1001|1003|1004|1005|1006|1009)|The Internet connection appears to be offline|No network route|timed out|network connection was lost|cannot find host|could not resolve host'
          attempt=1
          while true; do
            notary_log="$(mktemp)"
            if xcrun notarytool submit "${NOTARY_ZIP}" \
              --key "${OASIS_NOTARY_KEY_PATH}" \
              --key-id "${OASIS_APPLE_API_KEY_ID}" \
              --issuer "${OASIS_APPLE_API_ISSUER}" \
              --wait --verbose > "${notary_log}" 2>&1
            then
              cat "${notary_log}"
              rm -f "${notary_log}"
              break
            fi
            cat "${notary_log}" >&2
            if ! grep -Eiq "${RETRYABLE_NOTARY_RE}" "${notary_log}"; then
              rm -f "${notary_log}"
              exit 1
            fi
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              rm -f "${notary_log}"
              exit 1
            fi
            sleep_seconds="${backoffs[$((attempt - 1))]}"
            rm -f "${notary_log}"
            sleep "${sleep_seconds}"
            attempt=$((attempt + 1))
          done

          xcrun stapler staple "${PKG_APP}"
          xcrun stapler validate "${PKG_APP}"
          spctl -a -vv "${PKG_APP}"
          echo "OASIS_APPLE_NOTARY_APP_ZIP=${NOTARY_ZIP}" >> "${GITHUB_ENV}"

      - name: Record post-notarization executable hash
        id: golden_hash
        run: |
          set -euo pipefail
          HASH="$(shasum -a 256 "${{ steps.meta.outputs.executable_path }}" | awk '{print $1}')"
          echo "hash=${HASH}" >> "${GITHUB_OUTPUT}"

      - name: Create signed DMG
        env:
          OASIS_APPLE_SIGNING_IDENTITY: ${{ secrets.OASIS_APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${OASIS_APPLE_SIGNING_IDENTITY}" ]; then
            echo "Missing OASIS_APPLE_SIGNING_IDENTITY for DMG signing." >&2
            exit 1
          fi
          args=()
          if [ -n "${DSSTORE_PATH:-}" ]; then args+=(--dsstore "${DSSTORE_PATH}"); fi
          if [ -n "${BACKGROUND_PATH:-}" ]; then args+=(--background "${BACKGROUND_PATH}"); fi
          if [ -n "${ICON_PATH:-}" ]; then args+=(--icon "${ICON_PATH}"); fi
          if [ -n "${VOLUME_NAME:-}" ]; then args+=(--volume-name "${VOLUME_NAME}"); fi
          ./mach python -m mozbuild.action.make_dmg "${args[@]}" \
            "${OBJDIR}/dist/${MOZ_PKG_DIR}" \
            "${DMG_PATH}"
          codesign --keychain "${OASIS_APPLE_KEYCHAIN_PATH}" --force --timestamp --sign "${OASIS_APPLE_SIGNING_IDENTITY}" "${DMG_PATH}"

      - name: Notarize and staple DMG
        run: |
          set -euo pipefail
          max_attempts=12
          backoffs=(30 60 120 180 240 300 300 300 300 300 300)
          RETRYABLE_NOTARY_RE='statusCode: 50[0-4]|HTTP status code: 50[0-4]|UNEXPECTED_ERROR|HTTP status code: 408|HTTP status code: 429|NSURLErrorDomain Code=-(1001|1003|1004|1005|1006|1009)|The Internet connection appears to be offline|No network route|timed out|network connection was lost|cannot find host|could not resolve host'
          attempt=1
          while true; do
            notary_log="$(mktemp)"
            if xcrun notarytool submit "${DMG_PATH}" \
              --key "${OASIS_NOTARY_KEY_PATH}" \
              --key-id "${OASIS_APPLE_API_KEY_ID}" \
              --issuer "${OASIS_APPLE_API_ISSUER}" \
              --wait --verbose > "${notary_log}" 2>&1
            then
              cat "${notary_log}"
              rm -f "${notary_log}"
              break
            fi
            cat "${notary_log}" >&2
            if ! grep -Eiq "${RETRYABLE_NOTARY_RE}" "${notary_log}"; then
              rm -f "${notary_log}"
              exit 1
            fi
            if [ "${attempt}" -ge "${max_attempts}" ]; then
              rm -f "${notary_log}"
              exit 1
            fi
            sleep_seconds="${backoffs[$((attempt - 1))]}"
            rm -f "${notary_log}"
            sleep "${sleep_seconds}"
            attempt=$((attempt + 1))
          done
          xcrun stapler staple "${DMG_PATH}"
          xcrun stapler validate "${DMG_PATH}"

      - name: Verify golden executable hash before MAR
        run: |
          set -euo pipefail
          EXPECTED_HASH="${{ steps.golden_hash.outputs.hash }}"
          CURRENT_HASH="$(shasum -a 256 "${{ steps.meta.outputs.executable_path }}" | awk '{print $1}')"
          if [ "${CURRENT_HASH}" != "${EXPECTED_HASH}" ]; then
            echo "Golden executable changed after app notarization; refusing MAR build." >&2
            exit 1
          fi

      - name: Check updater cert material
        env:
          ALLOW_DEV_OASIS_CERTS: ${{ vars.ALLOW_DEV_OASIS_CERTS }}
        run: |
          set -euo pipefail
          scripts/update-signing/check-oasis-cert-material.sh

      - name: Build complete MAR
        id: mar
        run: |
          set -euo pipefail
          source scripts/ci/oasis-release-names.sh
          VERSION="${{ steps.meta.outputs.version }}"
          UPDATE_DIR="${OBJDIR}/dist/update"
          mkdir -p "${UPDATE_DIR}"
          UNSIGNED_MAR="${UPDATE_DIR}/oasis-${VERSION}-${BUILD_TARGET}-${LOCALE}.complete.mar"
          SIGNED_MAR="${UPDATE_DIR}/$(oasis_mar_name "${VERSION}" "${BUILD_TARGET}" "${LOCALE}")"
          scripts/update-signing/build-complete-mar.sh \
            "${OBJDIR}" \
            "${PKG_APP}" \
            "${UNSIGNED_MAR}" \
            "${VERSION}" \
            "${RING}"
          echo "unsigned_mar=${UNSIGNED_MAR}" >> "${GITHUB_OUTPUT}"
          echo "signed_mar=${SIGNED_MAR}" >> "${GITHUB_OUTPUT}"

      - name: Sign and verify MAR
        env:
          OASIS_MAR_SIGNING_CERT_NICKNAME: ${{ secrets.OASIS_MAR_SIGNING_CERT_NICKNAME }}
          OASIS_MAR_SIGNING_P12_B64: ${{ secrets.OASIS_MAR_SIGNING_P12_B64 }}
          OASIS_MAR_SIGNING_P12_PASSWORD: ${{ secrets.OASIS_MAR_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          NSS_DB_DIR="${RUNNER_TEMP}/oasis-nssdb"
          P12_PATH="${RUNNER_TEMP}/oasis-signing.p12"
          mkdir -p "${NSS_DB_DIR}"
          python3 -c 'import base64, os, sys; sys.stdout.buffer.write(base64.b64decode(os.environ["OASIS_MAR_SIGNING_P12_B64"]))' > "${P12_PATH}"
          "${OBJDIR}/dist/bin/certutil" -N -d "sql:${NSS_DB_DIR}" --empty-password
          "${OBJDIR}/dist/bin/pk12util" -i "${P12_PATH}" -d "sql:${NSS_DB_DIR}" -W "${OASIS_MAR_SIGNING_P12_PASSWORD}"
          scripts/update-signing/sign-mar.sh \
            "${OBJDIR}" \
            "${{ steps.mar.outputs.unsigned_mar }}" \
            "${{ steps.mar.outputs.signed_mar }}" \
            "${NSS_DB_DIR}" \
            "${OASIS_MAR_SIGNING_CERT_NICKNAME}"
          scripts/update-signing/verify-mar.sh \
            "${OBJDIR}" \
            "${{ steps.mar.outputs.signed_mar }}" \
            toolkit/mozapps/update/updater/oasis_primary.der
          rm -f "${P12_PATH}"
          rm -rf "${NSS_DB_DIR}"

      - name: Prepare release artifacts
        id: artifacts
        run: |
          set -euo pipefail
          source scripts/ci/oasis-release-names.sh
          VERSION="${{ steps.meta.outputs.version }}"
          BUILD_ID="${{ steps.meta.outputs.build_id }}"
          DMG_ASSET_NAME="$(oasis_dmg_name "${VERSION}" "${LOCALE}" "${ARCH_SLUG}")"
          MAR_ASSET_NAME="$(oasis_mar_name "${VERSION}" "${BUILD_TARGET}" "${LOCALE}")"
          STAGING="${RUNNER_TEMP}/oasis-release-artifacts"
          mkdir -p "${STAGING}"
          cp "${DMG_PATH}" "${STAGING}/${DMG_ASSET_NAME}"
          cp "${{ steps.mar.outputs.signed_mar }}" "${STAGING}/${MAR_ASSET_NAME}"
          export VERSION BUILD_ID BUILD_TARGET ARCH_SLUG DMG_ASSET_NAME MAR_ASSET_NAME STAGING
          python3 <<'PY'
          import json
          import os

          payload = {
              "version": os.environ["VERSION"],
              "build_id": os.environ["BUILD_ID"],
              "build_target": os.environ["BUILD_TARGET"],
              "arch_slug": os.environ["ARCH_SLUG"],
              "dmg_asset_name": os.environ["DMG_ASSET_NAME"],
              "mar_asset_name": os.environ["MAR_ASSET_NAME"],
          }
          with open(os.path.join(os.environ["STAGING"], "meta.json"), "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2)
          PY
          echo "staging_dir=${STAGING}" >> "${GITHUB_OUTPUT}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oasis-macos-${{ inputs.arch_slug }}
          path: ${{ steps.artifacts.outputs.staging_dir }}
          retention-days: 7

      - name: Cleanup signing and notarization material
        if: always()
        run: |
          set +e
          if [ -n "${OASIS_APPLE_KEYCHAIN_ORIGINAL_LIST:-}" ]; then
            security list-keychains -d user -s ${OASIS_APPLE_KEYCHAIN_ORIGINAL_LIST}
          fi
          if [ -n "${OASIS_APPLE_KEYCHAIN_PATH:-}" ]; then
            security default-keychain -d user -s login.keychain-db
            security delete-keychain "${OASIS_APPLE_KEYCHAIN_PATH}"
          fi
          rm -f "${OASIS_APPLE_DEVELOPER_ID_P12_PATH:-}"
          rm -f "${OASIS_APPLE_DEVELOPER_ID_P12_PASSWORD_FILE:-}"
          rm -f "${OASIS_APPLE_NOTARY_APP_ZIP:-}"
          rm -f "${OASIS_NOTARY_KEY_PATH:-}"
