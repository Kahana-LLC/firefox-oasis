name: Oasis Release Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to run (vX.Y.Z.N)
        required: true
        type: string

permissions:
  contents: write

env:
  LOCALE: en-US

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_target: Darwin_aarch64-gcc3
            arch_slug: aarch64
            runner: macos-15
            objdir: obj-oasis-release-aarch64
          - build_target: Darwin_x86_64-gcc3
            arch_slug: x86_64
            runner: macos-15-intel
            objdir: obj-oasis-release-x86_64
    uses: ./.github/workflows/oasis-build-macos.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      build_target: ${{ matrix.build_target }}
      arch_slug: ${{ matrix.arch_slug }}
      runner: ${{ matrix.runner }}
      objdir: ${{ matrix.objdir }}
      update_channel: oasis-stable
      ring: oasis-stable
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: oasis-macos-*
          path: artifacts
          merge-multiple: false

      - name: Stage artifacts for publish
        run: |
          set -euo pipefail
          PUBLISH_DIR="${RUNNER_TEMP}/oasis-publish"
          mkdir -p "${PUBLISH_DIR}/aarch64" "${PUBLISH_DIR}/x86_64"
          for arch_slug in aarch64 x86_64; do
            src="artifacts/oasis-macos-${arch_slug}"
            if [ ! -d "${src}" ]; then
              echo "Missing downloaded artifact directory ${src}" >&2
              exit 1
            fi
            cp -a "${src}/." "${PUBLISH_DIR}/${arch_slug}/"
          done
          echo "PUBLISH_DIR=${PUBLISH_DIR}" >> "${GITHUB_ENV}"

      - name: Create versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MODE: versioned
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_DIR: ${{ env.PUBLISH_DIR }}
        run: |
          set -euo pipefail
          scripts/ci/oasis-publish-release.sh
