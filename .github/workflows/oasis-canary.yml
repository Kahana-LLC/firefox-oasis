name: Oasis Release Canary
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to run (vX.Y.Z.N)
        required: true
        type: string
permissions:
  contents: write
  actions: read
env:
  PRODUCT: Firefox
  LOCALE: en-US
  RING: oasis-canary
jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_target: Darwin_aarch64-gcc3
            arch_slug: aarch64
            runner: macos-15
            objdir: obj-oasis-canary-aarch64
          - build_target: Darwin_x86_64-gcc3
            arch_slug: x86_64
            runner: macos-15-intel
            objdir: obj-oasis-canary-x86_64
    uses: ./.github/workflows/oasis-build-macos.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      build_target: ${{ matrix.build_target }}
      arch_slug: ${{ matrix.arch_slug }}
      runner: ${{ matrix.runner }}
      objdir: ${{ matrix.objdir }}
      update_channel: oasis-canary
      ring: oasis-canary
    secrets: inherit

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_target: WINNT_x86_64-msvc
            arch_slug: x86_64
            runner: windows-latest
            objdir: obj-oasis-canary-win-x86_64
    uses: ./.github/workflows/oasis-build-windows.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      build_target: ${{ matrix.build_target }}
      arch_slug: ${{ matrix.arch_slug }}
      runner: ${{ matrix.runner }}
      objdir: ${{ matrix.objdir }}
      update_channel: oasis-canary
      ring: oasis-canary
    secrets: inherit

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    environment: canary-signing
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download macOS build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: oasis-macos-*
          path: artifacts
          merge-multiple: false
      - name: Download Windows build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: oasis-windows-*
          path: artifacts
          merge-multiple: false
      - name: Stage artifacts for publish
        run: |
          set -euo pipefail
          PUBLISH_DIR="${RUNNER_TEMP}/oasis-publish"
          mkdir -p "${PUBLISH_DIR}/aarch64" "${PUBLISH_DIR}/x86_64"
          for arch_slug in aarch64 x86_64; do
            src="artifacts/oasis-macos-${arch_slug}"
            if [ ! -d "${src}" ]; then
              echo "Missing downloaded artifact directory ${src}" >&2
              exit 1
            fi
            cp -a "${src}/." "${PUBLISH_DIR}/${arch_slug}/"
          done
          mkdir -p "${PUBLISH_DIR}/windows-x86_64"
          WIN_SRC="artifacts/oasis-windows-x86_64"
          if [ ! -d "${WIN_SRC}" ]; then
            echo "Missing downloaded artifact directory ${WIN_SRC}" >&2
            exit 1
          fi
          cp -a "${WIN_SRC}/." "${PUBLISH_DIR}/windows-x86_64/"
          echo "PUBLISH_DIR=${PUBLISH_DIR}" >> "${GITHUB_ENV}"
      - name: Publish to canary release and register update service
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_MODE: canary
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_DIR: ${{ env.PUBLISH_DIR }}
          OASIS_UPDATE_SERVICE_URL: ${{ secrets.OASIS_UPDATE_SERVICE_URL }}
          OASIS_ADMIN_TOKEN: ${{ secrets.OASIS_UPDATE_ADMIN_TOKEN }}
          PRODUCT: ${{ env.PRODUCT }}
          LOCALE: ${{ env.LOCALE }}
          RING: ${{ env.RING }}
        run: |
          set -euo pipefail
          scripts/ci/oasis-publish-release.sh